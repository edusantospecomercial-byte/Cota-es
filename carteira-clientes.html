<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carteira de Clientes — Eduardo Santos</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0A0D14;
  --surface:  #11151F;
  --card:     #161B2A;
  --border:   #1E2638;
  --accent:   #4F8EF7;
  --accent2:  #7C5CFC;
  --green:    #22C55E;
  --amber:    #F59E0B;
  --red:      #EF4444;
  --metlife:  #3B82F6;
  --zurich:   #0D9488;
  --lg:       #7C3AED;
  --text:     #E8EDF5;
  --muted:    #6B7A99;
  --dim:      #3A4560;
  --wa:       #25D366;
  --radius:   14px;
  --radius-sm:8px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family:'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* TOP BAR */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,13,20,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
  height: 60px;
}
.logo {
  font-size: 15px; font-weight: 700;
  background: linear-gradient(135deg, #4F8EF7, #7C5CFC);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: -0.3px;
}
.badge-total {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 4px 12px;
  border-radius: 100px;
  font-size: 12px; color: var(--muted); font-family:'DM Mono',monospace;
}
.badge-total span { color: var(--accent); font-weight: 600; }

/* SEARCH */
.search-wrap {
  padding: 16px 20px 12px;
  position: sticky; top: 60px; z-index: 99;
  background: var(--bg);
}
.search-box {
  position: relative;
}
.search-box input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 44px 12px 44px;
  color: var(--text);
  font-family: inherit; font-size: 14px;
  outline: none; transition: border-color .2s;
}
.search-box input:focus { border-color: var(--accent); }
.search-box input::placeholder { color: var(--muted); }
.search-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: 16px;
}
.clear-btn {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 18px; display: none;
}

/* FILTERS */
.filters {
  padding: 0 20px 14px;
  display: flex; gap: 8px; overflow-x: auto;
  scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.filter-btn {
  white-space: nowrap;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 6px 14px;
  font-size: 12px; font-weight: 500; font-family: inherit;
  color: var(--muted); cursor: pointer;
  transition: all .15s;
}
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.filter-btn.metlife.active { background: var(--metlife); border-color: var(--metlife); }
.filter-btn.zurich.active { background: var(--zurich); border-color: var(--zurich); }
.filter-btn.lg.active { background: var(--lg); border-color: var(--lg); }
.filter-btn.wa.active { background: var(--wa); border-color: var(--wa); }

/* STATS BAR */
.stats-row {
  padding: 0 20px 14px;
  display: flex; gap: 10px;
}
.stat-chip {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  text-align: center;
}
.stat-chip .num { font-size: 18px; font-weight: 700; color: var(--accent); font-family: 'DM Mono', monospace; }
.stat-chip .lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* LIST */
.list-container {
  padding: 0 20px 120px;
  display: flex; flex-direction: column; gap: 8px;
}
.client-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer;
  transition: all .15s;
  position: relative;
  overflow: hidden;
}
.client-card::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--border);
  transition: background .15s;
}
.client-card.has-prod::before { background: var(--accent2); }
.client-card.is-metlife::before { background: var(--metlife); }
.client-card.is-zurich::before { background: var(--zurich); }
.client-card.is-lg::before { background: var(--lg); }
.client-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.client-card:hover::before { background: var(--accent); }
.client-card:active { transform: translateY(0); }

.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.avatar.metlife { background: linear-gradient(135deg, #1D4ED8, #3B82F6); }
.avatar.zurich { background: linear-gradient(135deg, #0F766E, #14B8A6); }
.avatar.lg { background: linear-gradient(135deg, #6D28D9, #8B5CF6); }

.client-info { flex: 1; min-width: 0; }
.client-name {
  font-size: 14px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.client-sub {
  font-size: 12px; color: var(--muted); margin-top: 3px;
  display: flex; align-items: center; gap: 8px;
}
.client-sub .nasc { font-family: 'DM Mono', monospace; font-size: 11px; }

.right-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }

.prod-tag {
  font-size: 10px; font-weight: 600; padding: 3px 8px;
  border-radius: 100px; white-space: nowrap;
}
.prod-tag.zurich { background: rgba(13,148,136,.2); color: #5EEAD4; }
.prod-tag.lg { background: rgba(124,58,237,.2); color: #A78BFA; }
.prod-tag.royal { background: rgba(220,38,38,.15); color: #FCA5A5; }
.prod-tag.aviva { background: rgba(59,130,246,.15); color: #93C5FD; }
.prod-tag.none { background: var(--surface); color: var(--muted); }
.prod-tag.metlife-tag { background: rgba(37,99,235,.25); color: #93C5FD; }

.wa-btn {
  display: flex; align-items: center; gap: 4px;
  background: rgba(37,211,102,.12);
  border: 1px solid rgba(37,211,102,.25);
  border-radius: 100px;
  padding: 4px 10px;
  font-size: 11px; font-weight: 600; color: var(--wa);
  text-decoration: none;
  transition: all .15s;
}
.wa-btn:hover { background: rgba(37,211,102,.25); }
.wa-btn svg { width: 12px; height: 12px; fill: var(--wa); }
.no-tel { font-size: 10px; color: var(--dim); }

.seq-num {
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--dim);
}

/* MODAL */
.overlay {
  display: none;
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.75);
  backdrop-filter: blur(8px);
  padding: 20px;
  overflow-y: auto;
}
.overlay.open { display: flex; align-items: flex-start; justify-content: center; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  width: 100%; max-width: 600px;
  overflow: hidden;
  margin: auto;
  animation: slideUp .25s ease;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

.modal-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px;
}
.modal-avatar {
  width: 52px; height: 52px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.modal-title { flex: 1; min-width: 0; }
.modal-name { font-size: 17px; font-weight: 700; }
.modal-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.modal-close {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 50%;
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--muted); font-size: 18px;
  flex-shrink: 0; transition: all .15s;
}
.modal-close:hover { color: var(--text); border-color: var(--accent); }

.modal-body { padding: 20px; }

.action-row {
  display: flex; gap: 10px; margin-bottom: 20px;
}
.action-btn {
  flex: 1; padding: 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  text-decoration: none; transition: all .15s;
}
.action-btn.wa {
  background: rgba(37,211,102,.1);
  border-color: rgba(37,211,102,.3);
  color: var(--wa);
}
.action-btn.wa:hover { background: rgba(37,211,102,.2); }
.action-btn.email {
  background: rgba(79,142,247,.1);
  border-color: rgba(79,142,247,.3);
  color: var(--accent);
}
.action-btn.email:hover { background: rgba(79,142,247,.2); }
.action-btn.disabled {
  opacity: .3; pointer-events: none;
  background: var(--card); color: var(--muted);
}

.section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 1px;
  color: var(--muted); text-transform: uppercase;
  margin-bottom: 10px; margin-top: 16px;
}
.section-label:first-of-type { margin-top: 0; }

.fields-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.field {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
}
.field.full { grid-column: 1 / -1; }
.field-label { font-size: 10px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
.field-value { font-size: 13px; font-weight: 500; color: var(--text); word-break: break-word; }
.field-value.highlight { color: var(--accent); font-family: 'DM Mono', monospace; }
.field-value.green { color: var(--green); }
.field-value.amber { color: var(--amber); }

.metlife-badge {
  background: linear-gradient(135deg, #1D4ED8, #3B82F6);
  border-radius: var(--radius-sm); padding: 10px 14px;
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px;
}
.metlife-badge svg { width: 20px; height: 20px; fill: #fff; flex-shrink: 0; }
.metlife-badge-text { font-size: 13px; font-weight: 600; color: #fff; }
.metlife-badge-sub { font-size: 11px; color: rgba(255,255,255,.7); margin-top: 1px; }

/* EMPTY */
.empty {
  text-align: center; padding: 60px 20px;
  color: var(--muted); font-size: 14px;
}
.empty .icon { font-size: 40px; margin-bottom: 12px; }

/* RESULT COUNT */
.result-count {
  padding: 0 20px 10px;
  font-size: 12px; color: var(--muted);
}

/* SCROLL TOP */
.scroll-top {
  position: fixed; bottom: 24px; right: 20px;
  background: var(--accent2);
  border: none; border-radius: 50%;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: #fff; font-size: 20px;
  box-shadow: 0 4px 20px rgba(124,92,252,.4);
  opacity: 0; transition: opacity .2s;
  z-index: 90;
}
.scroll-top.visible { opacity: 1; }

@media (max-width: 480px) {
  .fields-grid { grid-template-columns: 1fr; }
  .field.full { grid-column: 1; }
  .action-row { flex-direction: column; }
}
</style>
</head>

let currentFilter = 'all';
let currentSearch = '';

// Compute stats
function computeStats(data) {
  const waCount = data.filter(c => c.tel_wa && c.tel_wa.length > 7).length;
  const prodCount = data.filter(c => c.prod && c.prod !== '—').length;
  const mlCount = data.filter(c => c.metlife).length;
  document.getElementById('st-total').textContent = data.length;
  document.getElementById('st-wa').textContent = waCount;
  document.getElementById('st-prod').textContent = prodCount;
  document.getElementById('st-ml').textContent = mlCount;
  document.getElementById('total-badge').textContent = DATA.length;
}

function getProdClass(prod) {
  if (!prod || prod === '—') return 'none';
  if (prod.includes('Zurich')) return 'zurich';
  if (prod.includes('L&G') || prod.includes('Legal')) return 'lg';
  if (prod.includes('Royal')) return 'royal';
  if (prod.includes('Aviva')) return 'aviva';
  if (prod.includes('MetLife')) return 'metlife-tag';
  return 'none';
}

function getAvatarClass(c) {
  if (c.metlife) return 'metlife';
  if (c.prod && c.prod.includes('Zurich')) return 'zurich';
  if (c.prod && (c.prod.includes('L&G') || c.prod.includes('Legal'))) return 'lg';
  return '';
}

function getInitials(nome) {
  const parts = nome.trim().split(' ');
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return parts[0][0].toUpperCase();
}

function getWaUrl(tel_wa, nome) {
  if (!tel_wa || tel_wa.length < 8) return null;
  const msg = encodeURIComponent(`Olá ${nome.split(' ')[0]}, tudo bem? 😊`);
  return `https://wa.me/${tel_wa}?text=${msg}`;
}

function render(data) {
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const rc = document.getElementById('result-count');

  if (data.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    rc.textContent = '';
    return;
  }
  empty.style.display = 'none';

  if (currentSearch || currentFilter !== 'all') {
    rc.textContent = `${data.length} resultado${data.length !== 1 ? 's' : ''} encontrado${data.length !== 1 ? 's' : ''}`;
  } else {
    rc.textContent = '';
  }

  list.innerHTML = data.map(c => {
    const initials = getInitials(c.nome);
    const waUrl = getWaUrl(c.tel_wa, c.nome);
    const prodClass = getProdClass(c.prod);
    const avatarClass = getAvatarClass(c);
    const prodLabel = c.prod && c.prod !== '—' ? c.prod : 'Prospect';
    const cardClass = [
      'client-card',
      c.metlife ? 'is-metlife' : '',
      c.prod && c.prod.includes('Zurich') ? 'is-zurich' : '',
      c.prod && (c.prod.includes('L&G') || c.prod.includes('Legal')) ? 'is-lg' : '',
      c.prod && c.prod !== '—' ? 'has-prod' : ''
    ].filter(Boolean).join(' ');

    return `
    <div class="${cardClass}" onclick="openModal(${c.id - 1})">
      <div class="avatar ${avatarClass}">${initials}</div>
      <div class="client-info">
        <div class="client-name">${c.nome}</div>
        <div class="client-sub">
          <span class="nasc">${c.nasc}</span>
          ${c.email && c.email !== '—' ? `<span>·</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px">${c.email}</span>` : ''}
        </div>
      </div>
      <div class="right-side">
        <span class="prod-tag ${prodClass}">${prodLabel.length > 18 ? prodLabel.substring(0,16)+'…' : prodLabel}</span>
        ${waUrl
          ? `<a class="wa-btn" href="${waUrl}" target="_blank" onclick="event.stopPropagation()">
              <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
              ${c.tel !== '—' ? c.tel : 'WA'}

        }
      </div>
    </div>`;
  }).join('');

  computeStats(data);
}

function filterData() {
  let data = [...DATA];

  // Search
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    data = data.filter(c =>
      c.nome.toLowerCase().includes(q) ||
      (c.email && c.email.toLowerCase().includes(q)) ||
      (c.tel && c.tel.includes(q))
    );
  }

  // Filter
  if (currentFilter === 'metlife') data = data.filter(c => c.metlife);
  if (currentFilter === 'zurich') data = data.filter(c => c.prod && c.prod.includes('Zurich'));
  if (currentFilter === 'lg') data = data.filter(c => c.prod && (c.prod.includes('L&G') || c.prod.includes('Legal')));
  if (currentFilter === 'wa') data = data.filter(c => c.tel_wa && c.tel_wa.length > 7);
  if (currentFilter === 'prod') data = data.filter(c => c.prod && c.prod !== '—');
  if (currentFilter === 'noprod') data = data.filter(c => !c.prod || c.prod === '—');

  render(data);
}

// Search
document.getElementById('search').addEventListener('input', function() {
  currentSearch = this.value;
  document.getElementById('clear-btn').style.display = this.value ? 'block' : 'none';
  filterData();
});
document.getElementById('clear-btn').addEventListener('click', function() {
  document.getElementById('search').value = '';
  currentSearch = '';
  this.style.display = 'none';
  filterData();
});

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentFilter = this.dataset.filter;
    filterData();
  });
});

// Modal
function openModal(index) {
  const c = DATA[index];
  if (!c) return;

  const overlay = document.getElementById('overlay');
  const initials = getInitials(c.nome);
  const waUrl = getWaUrl(c.tel_wa, c.nome);
  const avatarClass = getAvatarClass(c);

  document.getElementById('m-avatar').textContent = initials;
  document.getElementById('m-avatar').className = 'modal-avatar ' + avatarClass;
  document.getElementById('m-nome').textContent = c.nome;
  document.getElementById('m-sub').textContent = `Nascimento: ${c.nasc} · ${c.origem}`;

  const body = document.getElementById('m-body');

  const mlBadge = c.metlife ? `
    <div class="metlife-badge">
      <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <div>
        <div class="metlife-badge-text">🎯 Lead Quente — MetLife</div>
        <div class="metlife-badge-sub">Este cliente já possui/possuiu MetLife — oportunidade de conversão UK</div>
      </div>
    </div>
  ` : '';

  const prodStr = c.prod && c.prod !== '—' ? c.prod : 'Sem produto definido';
  const mensStr = c.mens && c.mens !== '—' ? c.mens : '—';

  body.innerHTML = `
    ${mlBadge}

    <div class="action-row">
      <a class="action-btn wa ${waUrl ? '' : 'disabled'}" href="${waUrl || '#'}" target="_blank">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
        WhatsApp
      </a>
      <a class="action-btn email ${c.email && c.email !== '—' ? '' : 'disabled'}"
         href="mailto:${c.email !== '—' ? c.email : ''}">
        ✉️ Email
      </a>
    </div>

    <div class="section-label">Dados Pessoais</div>
    <div class="fields-grid">
      <div class="field">
        <div class="field-label">Data de Nascimento</div>
        <div class="field-value highlight">${c.nasc}</div>
      </div>
      <div class="field">
        <div class="field-label">Telefone</div>
        <div class="field-value">${c.tel !== '—' ? c.tel : 'Não informado'}</div>
      </div>
      <div class="field full">
        <div class="field-label">Email</div>
        <div class="field-value">${c.email !== '—' ? c.email : 'Não informado'}</div>
      </div>
    </div>

    <div class="section-label">Seguro</div>
    <div class="fields-grid">
      <div class="field">
        <div class="field-label">Seguro Anterior</div>
        <div class="field-value ${c.seg && c.seg !== '—' ? 'amber' : ''}">${c.seg !== '—' ? c.seg : 'Nenhum'}</div>
      </div>
      <div class="field">
        <div class="field-label">Produto Novo</div>
        <div class="field-value ${c.prod && c.prod !== '—' ? 'green' : ''}">${prodStr}</div>
      </div>
      <div class="field">
        <div class="field-label">Mensalidade</div>
        <div class="field-value highlight">${mensStr}</div>
      </div>
      <div class="field">
        <div class="field-label">Origem do Lead</div>
        <div class="field-value">${c.origem}</div>
      </div>
    </div>
  `;

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ESC key
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// Scroll top
window.addEventListener('scroll', () => {
  const btn = document.getElementById('scroll-top');
  btn.classList.toggle('visible', window.scrollY > 400);
});

// Init
filterData();
</script>
</body>
</html>
