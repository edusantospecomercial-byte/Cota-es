<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Carteira — Eduardo Santos</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D14; --sf:#11151F; --card:#161B2A; --bd:#1E2638;
  --acc:#4F8EF7; --acc2:#7C5CFC; --grn:#22C55E; --amb:#F59E0B;
  --ml:#3B82F6; --zh:#0D9488; --lg:#7C3AED; --wa:#25D366;
  --tx:#E8EDF5; --mt:#6B7A99; --dm:#2A3350; --r:12px; --rs:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;}

/* TOPBAR */
.bar{position:sticky;top:0;z-index:100;background:rgba(10,13,20,.96);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bd);padding:0 28px;height:56px;
  display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:14px;font-weight:700;background:linear-gradient(135deg,#4F8EF7,#7C5CFC);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.bk{background:var(--card);border:1px solid var(--bd);padding:3px 12px;
  border-radius:100px;font-size:12px;color:var(--mt);font-family:'DM Mono',monospace;}
.bk b{color:var(--acc);}

/* CONTROLS */
.ctrl{padding:14px 28px 8px;display:flex;gap:10px;align-items:center;}
.sb{position:relative;flex:1;max-width:420px;}
.sb input{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);
  padding:10px 36px 10px 38px;color:var(--tx);font-family:inherit;font-size:13px;outline:none;transition:border-color .2s;}
.sb input:focus{border-color:var(--acc);}
.sb input::placeholder{color:var(--mt);}
.si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mt);font-size:14px;}
.cx{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;
  color:var(--mt);cursor:pointer;font-size:16px;display:none;}

/* FILTERS */
.flt{padding:0 28px 10px;display:flex;gap:7px;flex-wrap:wrap;}
.fb{background:var(--sf);border:1px solid var(--bd);border-radius:100px;
  padding:5px 13px;font-size:12px;font-weight:500;font-family:inherit;
  color:var(--mt);cursor:pointer;transition:all .15s;white-space:nowrap;}
.fb:hover{border-color:var(--acc);color:var(--tx);}
.fb.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.fb.fml.on{background:var(--ml);border-color:var(--ml);}
.fb.fzh.on{background:var(--zh);border-color:var(--zh);}
.fb.flg.on{background:var(--lg);border-color:var(--lg);}
.fb.fwa.on{background:var(--wa);border-color:var(--wa);}
.fb.fen.on{background:#F59E0B;border-color:#F59E0B;color:#000;}

/* STATS */
.sts{padding:0 28px 12px;display:flex;gap:10px;flex-wrap:wrap;}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);
  padding:10px 18px;min-width:90px;}
.sc .n{font-size:20px;font-weight:700;font-family:'DM Mono',monospace;}
.sc .l{font-size:10px;color:var(--mt);margin-top:1px;text-transform:uppercase;letter-spacing:.5px;}

/* RC */
.rc{padding:0 28px 8px;font-size:12px;color:var(--mt);}

/* TABLE */
.tw{padding:0 28px 80px;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{background:var(--sf);color:var(--mt);font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.8px;padding:10px 14px;text-align:left;
  border-bottom:1px solid var(--bd);white-space:nowrap;position:sticky;top:56px;z-index:10;}
tbody tr{border-bottom:1px solid var(--dm);transition:background .12s;cursor:pointer;}
tbody tr:hover{background:rgba(79,142,247,.06);}
tbody td{padding:10px 14px;vertical-align:middle;}
.nc{color:var(--mt);font-family:'DM Mono',monospace;font-size:11px;text-align:center;width:36px;}

/* avatar */
.avw{display:flex;align-items:center;gap:10px;}
.av{width:34px;height:34px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--acc2),var(--acc));
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff;}
.av.ml{background:linear-gradient(135deg,#1D4ED8,#3B82F6);}
.av.zh{background:linear-gradient(135deg,#0F766E,#14B8A6);}
.av.lg{background:linear-gradient(135deg,#6D28D9,#8B5CF6);}
.nm{font-weight:600;font-size:13px;}

/* WA */
.wab{display:inline-flex;align-items:center;gap:5px;
  background:rgba(37,211,102,.1);border:1px solid rgba(37,211,102,.25);
  border-radius:100px;padding:5px 11px;font-size:11px;font-weight:600;
  color:var(--wa);text-decoration:none;white-space:nowrap;transition:all .15s;}
.wab:hover{background:rgba(37,211,102,.22);transform:scale(1.03);}
.wab svg{width:11px;height:11px;fill:var(--wa);flex-shrink:0;}
.nt{color:var(--dm);font-size:11px;}

/* tags */
.tag{display:inline-block;border-radius:100px;padding:3px 9px;font-size:10px;font-weight:600;white-space:nowrap;}
.tzh{background:rgba(13,148,136,.15);color:#5EEAD4;}
.tlg{background:rgba(124,58,237,.15);color:#A78BFA;}
.trl{background:rgba(220,38,38,.12);color:#FCA5A5;}
.tav{background:rgba(59,130,246,.12);color:#93C5FD;}
.tml{background:rgba(37,99,235,.2);color:#93C5FD;}
.tno{color:var(--dm);font-size:11px;}
.new-badge{display:inline-flex;align-items:center;gap:3px;margin-left:6px;
  background:rgba(245,158,11,.18);color:var(--amb);border-radius:100px;
  padding:2px 8px;font-size:9px;font-weight:700;letter-spacing:.3px;white-space:nowrap;vertical-align:middle;}

/* enviado toggle */
.env-btn{display:inline-flex;align-items:center;gap:5px;
  border-radius:100px;padding:4px 10px;font-size:11px;font-weight:600;
  border:1px solid var(--bd);cursor:pointer;background:none;
  font-family:inherit;color:var(--mt);transition:all .15s;white-space:nowrap;}
.env-btn:hover{border-color:var(--grn);color:var(--grn);}
.env-btn.sim{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.35);color:var(--grn);}
.env-btn .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}

.mono{font-family:'DM Mono',monospace;font-size:11px;color:var(--mt);}
.grn{color:var(--grn);font-family:'DM Mono',monospace;font-size:12px;}
.ml-star{color:var(--ml);font-size:14px;}
.orig-tag{font-size:10px;}
.orig-zh{color:var(--zh);}
.orig-f{color:var(--dm);}

/* MODAL */
.ov{display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.72);backdrop-filter:blur(8px);
  padding:24px;overflow-y:auto;}
.ov.open{display:flex;align-items:flex-start;justify-content:center;}
.md{background:var(--sf);border:1px solid var(--bd);border-radius:18px;
  width:100%;max-width:580px;margin:auto;overflow:hidden;animation:su .22s ease;}
@keyframes su{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.mh{padding:18px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;}
.mav{width:48px;height:48px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--acc2),var(--acc));
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;}
.mav.ml{background:linear-gradient(135deg,#1D4ED8,#3B82F6);}
.mav.zh{background:linear-gradient(135deg,#0F766E,#14B8A6);}
.mav.lg{background:linear-gradient(135deg,#6D28D9,#8B5CF6);}
.mt_{flex:1;min-width:0;}
.mn_{font-size:16px;font-weight:700;}
.ms_{font-size:11px;color:var(--mt);margin-top:2px;}
.mc_{background:var(--card);border:1px solid var(--bd);border-radius:50%;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--mt);font-size:16px;flex-shrink:0;transition:all .15s;}
.mc_:hover{color:var(--tx);border-color:var(--acc);}
.mb{padding:18px 20px;}
.ar{display:flex;gap:8px;margin-bottom:18px;}
.ab{flex:1;padding:11px;border-radius:var(--rs);border:1px solid var(--bd);
  font-family:inherit;font-size:13px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  text-decoration:none;transition:all .15s;}
.ab.wa_{background:rgba(37,211,102,.1);border-color:rgba(37,211,102,.3);color:var(--wa);}
.ab.wa_:hover{background:rgba(37,211,102,.22);}
.ab.em_{background:rgba(79,142,247,.1);border-color:rgba(79,142,247,.3);color:var(--acc);}
.ab.em_:hover{background:rgba(79,142,247,.2);}
.ab.off{opacity:.3;pointer-events:none;background:var(--card);color:var(--mt);}
.sl{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--mt);
  text-transform:uppercase;margin:16px 0 8px;}
.sl:first-of-type{margin-top:0;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.fd{background:var(--card);border:1px solid var(--bd);border-radius:var(--rs);padding:9px 12px;}
.fd.full{grid-column:1/-1;}
.fdl{font-size:10px;color:var(--mt);margin-bottom:3px;font-weight:500;}
.fdv{font-size:13px;font-weight:500;word-break:break-word;}
.fdv.hi{color:var(--acc);font-family:'DM Mono',monospace;}
.fdv.gr{color:var(--grn);}
.fdv.am{color:var(--amb);}
.fdv.re{color:#EF4444;}

/* enviado modal */
.env-row{display:flex;align-items:center;gap:10px;margin-top:14px;
  background:var(--card);border:1px solid var(--bd);border-radius:var(--rs);padding:12px 14px;}
.env-row label{font-size:13px;font-weight:600;flex:1;}
.env-toggle{position:relative;width:44px;height:24px;cursor:pointer;}
.env-toggle input{opacity:0;width:0;height:0;}
.env-slider{position:absolute;inset:0;background:var(--bd);border-radius:100px;transition:.2s;}
.env-slider:before{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;
  background:#fff;border-radius:50%;transition:.2s;}
.env-toggle input:checked+.env-slider{background:var(--grn);}
.env-toggle input:checked+.env-slider:before{transform:translateX(20px);}
.env-date{font-size:11px;color:var(--mt);}

/* ml badge */
.mlb{background:linear-gradient(135deg,#1D4ED8,#2563EB);border-radius:var(--rs);
  padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.mlb svg{width:18px;height:18px;fill:#fff;flex-shrink:0;}
.mlbt{font-size:13px;font-weight:700;color:#fff;}
.mlbs{font-size:11px;color:rgba(255,255,255,.7);margin-top:1px;}

/* msg preview */
.msg-box{background:var(--card);border:1px solid var(--bd);border-radius:var(--rs);
  padding:12px 14px;font-size:12px;color:var(--mt);
  white-space:pre-line;line-height:1.65;margin-top:6px;}

.seg-chip{display:inline-flex;align-items:center;gap:5px;
  border-radius:100px;padding:4px 10px;font-size:11px;font-weight:600;}
.seg-zh{background:rgba(13,148,136,.15);color:#5EEAD4;}
.seg-lg{background:rgba(124,58,237,.15);color:#A78BFA;}
.seg-ml{background:rgba(37,99,235,.18);color:#93C5FD;}
.seg-rl{background:rgba(220,38,38,.12);color:#FCA5A5;}
.seg-av{background:rgba(59,130,246,.12);color:#93C5FD;}
.seg-nd{color:var(--dm);}

.stb{position:fixed;bottom:22px;right:24px;background:var(--acc2);border:none;
  border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#fff;font-size:18px;box-shadow:0 4px 18px rgba(124,92,252,.4);
  opacity:0;transition:opacity .2s;z-index:90;}
.stb.vis{opacity:1;}

.empty{text-align:center;padding:60px;color:var(--mt);}
</style>
</head>

</div>

  <div class="mb" id="mb"></div>

</div>

  const msg=WA_TPL.replace('{NOME}',first);
  return `https://wa.me/${c.tel_wa}?text=${encodeURIComponent(msg)}`;
}

function avCls(c){
  if(c.metlife)return 'ml';
  if(c.seguradora==='Zurich')return 'zh';
  if(c.seguradora==='Legal & General')return 'lg';
  return '';
}

function segChip(seg){
  if(!seg||seg==='—') return '<span class="seg-nd">—</span>';
  let cls='';
  if(seg==='Zurich')cls='seg-zh';
  else if(seg==='Legal & General')cls='seg-lg';
  else if(seg==='MetLife')cls='seg-ml';
  else if(seg==='Royal London')cls='seg-rl';
  else if(seg==='Aviva')cls='seg-av';
  return `<span class="seg-chip ${cls}">${seg}</span>`;
}

function prodShort(p){
  if(!p||p==='—')return '<span class="tno">—</span>';
  // Remove seguradora name from product string for cleaner display
  let clean = p.replace('Zurich ','').replace('L&G ','').replace('Legal & General ','')
               .replace('Royal London ','').replace('MetLife ','').replace('Aviva ','');
  const tag = p.includes('Zurich')?'tzh':p.includes('L&G')||p.includes('Legal')?'tlg':
              p.includes('Royal')?'trl':p.includes('Aviva')?'tav':p.includes('MetLife')?'tml':'';
  const display = clean.length>20?clean.substring(0,18)+'…':clean;
  return `<span class="tag ${tag}" title="${p}">${display}</span>`;
}

function toggleEnviado(id, el, dateEl){
  const idx = DATA.findIndex(c=>c.id===id);
  if(idx===-1)return;
  DATA[idx].enviado = !DATA[idx].enviado;
  SENT[id] = DATA[idx].enviado ? new Date().toLocaleDateString('pt-BR') : false;
  if(!SENT[id]) delete SENT[id];
  saveSent(SENT);
  // Update button
  const env = DATA[idx].enviado;
  el.className = 'env-btn' + (env?' sim':'');
  el.innerHTML = `<span class="dot"></span>${env?'✅ Enviado':'Marcar Enviado'}`;
  if(dateEl) dateEl.textContent = env ? (SENT[id]||'') : '';
  updateStats(filteredData());
}

function filteredData(){
  let d=[...DATA];
  if(curS){const q=curS.toLowerCase();d=d.filter(c=>c.nome.toLowerCase().includes(q)||(c.email&&c.email.toLowerCase().includes(q))||(c.tel&&c.tel.includes(q)));}
  if(curF==='ml')  d=d.filter(c=>c.metlife);
  if(curF==='zh')  d=d.filter(c=>c.seguradora==='Zurich');
  if(curF==='lg')  d=d.filter(c=>c.seguradora==='Legal & General');
  if(curF==='wa')  d=d.filter(c=>c.tel_wa&&c.tel_wa.length>7);
  if(curF==='prod')d=d.filter(c=>c.seguradora!=='—');
  if(curF==='env') d=d.filter(c=>c.enviado);
  if(curF==='nenv')d=d.filter(c=>!c.enviado&&c.tel_wa&&c.tel_wa.length>7);
  if(curF==='np')  d=d.filter(c=>!c.seguradora||c.seguradora==='—');
  if(curF==='novo')d=d.filter(c=>c.novo);
  return d;
}

function updateStats(d){
  document.getElementById('st-t').textContent=d.length;
  document.getElementById('st-w').textContent=d.filter(c=>c.tel_wa&&c.tel_wa.length>7).length;
  document.getElementById('st-p').textContent=d.filter(c=>c.seguradora&&c.seguradora!=='—').length;
  document.getElementById('st-e').textContent=DATA.filter(c=>c.enviado).length;
  document.getElementById('st-ne').textContent=DATA.filter(c=>!c.enviado&&c.tel_wa&&c.tel_wa.length>7).length;
  document.getElementById('st-m').textContent=d.filter(c=>c.metlife).length;
  document.getElementById('tb').textContent=DATA.length;
}

function render(){
  const d=filteredData();
  const tbody=document.getElementById('tbody');
  const empty=document.getElementById('empty');
  const rc=document.getElementById('rc');

  updateStats(d);
  rc.textContent=(curS||curF!=='all')?`${d.length} resultado${d.length!==1?'s':''} encontrado${d.length!==1?'s':''}` : '';

  if(d.length===0){tbody.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';

  tbody.innerHTML=d.map((c,i)=>{
    const wa=waUrl(c);
    const av=avCls(c);
    const env=c.enviado;
    const envDate=SENT[c.id]||'';
    const segAntShort=c.seg_ant&&c.seg_ant!=='—'?(c.seg_ant.length>16?c.seg_ant.substring(0,14)+'…':c.seg_ant):'<span style="color:var(--dm)">—</span>';
    const mlS=c.metlife?'<span class="ml-star">★</span>':'';
    const novoS=c.novo?'<span class="new-badge">🆕 NOVO</span>':'';
    return `<tr onclick="openModal(${DATA.indexOf(c)})">
      <td class="nc">${i+1}</td>
      <td>
        <div class="avw">
          <div class="av ${av}">${ini(c.nome)}</div>
          <div class="nm">${c.nome}${novoS}</div>
        </div>
      </td>
      <td><span class="mono">${c.nasc}</span></td>
      <td onclick="event.stopPropagation()">
        ${wa
          ? `<a class="wab" href="${wa}" target="_blank"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>${c.tel!=='—'?c.tel:'WA'}</a>`
          : `<span class="nt">${c.tel!=='—'?c.tel:'—'}</span>`
        }
      </td>
      <td>${segChip(c.seguradora)}</td>
      <td>${prodShort(c.produto)}</td>
      <td><span class="grn">${c.mensalidade!=='—'?c.mensalidade:'—'}</span></td>
      <td title="${c.seg_ant||''}">${segAntShort}</td>
      <td onclick="event.stopPropagation()">
        <button class="env-btn${env?' sim':''}" onclick="toggleEnviado(${c.id},this,null)">
          <span class="dot"></span>${env?'✅ Enviado':'Marcar Enviado'}
        </button>
        ${envDate?`<div style="font-size:9px;color:var(--mt);margin-top:3px">${envDate}</div>`:''}
      </td>
      <td>${mlS}</td>
    </tr>`;
  }).join('');
}

function openModal(idx){
  const c=DATA[idx];
  if(!c)return;
  curModal=idx;
  const wa=waUrl(c);
  const av=avCls(c);
  document.getElementById('mav').textContent=ini(c.nome);
  document.getElementById('mav').className='mav '+av;
  document.getElementById('mn_').textContent=c.nome;
  document.getElementById('ms_').textContent=`${c.nasc} · ${c.origem}`;
  
  const first=c.nome.split(' ')[0];
  const msgPreview=WA_TPL.replace('{NOME}',first);
  const mlB=c.metlife?`<div class="mlb"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><div><div class="mlbt">🎯 Lead Quente — MetLife</div><div class="mlbs">Já possui MetLife — oportunidade de conversão UK</div></div></div>`:'' ;

  const envNow=c.enviado;
  const envDate=SENT[c.id]||'';

  document.getElementById('mb').innerHTML=`
    ${mlB}
    <div class="ar">
      <a class="ab wa_ ${wa?'':'off'}" href="${wa||'#'}" target="_blank">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
        Abrir WhatsApp
      </a>
      <a class="ab em_ ${c.email&&c.email!=='—'?'':'off'}" href="mailto:${c.email!=='—'?c.email:''}">✉️ Email</a>
    </div>

    <div class="sl">Status de Contato</div>
    <div class="env-row">
      <label>Mensagem enviada?</label>
      <span class="env-date" id="m-date">${envDate?'Enviado em '+envDate:''}</span>
      <label class="env-toggle">
        <input type="checkbox" id="m-env-chk" ${envNow?'checked':''} onchange="toggleEnviadoModal(${c.id},this)">
        <span class="env-slider"></span>
      </label>
    </div>

    <div class="sl">Dados Pessoais</div>
    <div class="fg">
      <div class="fd"><div class="fdl">Nascimento</div><div class="fdv hi">${c.nasc}</div></div>
      <div class="fd"><div class="fdl">Telefone</div><div class="fdv">${c.tel!=='—'?c.tel:'—'}</div></div>
      <div class="fd full"><div class="fdl">Email</div><div class="fdv">${c.email!=='—'?c.email:'—'}</div></div>
    </div>

    <div class="sl">Seguro</div>
    <div class="fg">
      <div class="fd"><div class="fdl">Seguradora</div><div class="fdv">${c.seguradora!=='—'?c.seguradora:'Não definida'}</div></div>
      <div class="fd"><div class="fdl">Produto</div><div class="fdv gr">${c.produto!=='—'?c.produto:'Sem produto'}</div></div>
      <div class="fd"><div class="fdl">Mensalidade</div><div class="fdv hi">${c.mensalidade!=='—'?c.mensalidade:'—'}</div></div>
      <div class="fd"><div class="fdl">Seguro Anterior</div><div class="fdv am">${c.seg_ant!=='—'?c.seg_ant:'Nenhum'}</div></div>
    </div>

    <div class="sl">Preview — Mensagem WhatsApp</div>
    <div class="msg-box">${msgPreview}</div>
  `;
  document.getElementById('ov').classList.add('open');
  document.body.style.overflow='hidden';
}

function toggleEnviadoModal(id, chk){
  const idx=DATA.findIndex(c=>c.id===id);
  if(idx===-1)return;
  DATA[idx].enviado=chk.checked;
  SENT[id]=chk.checked?new Date().toLocaleDateString('pt-BR'):false;
  if(!SENT[id])delete SENT[id];
  saveSent(SENT);
  const dateEl=document.getElementById('m-date');
  if(dateEl)dateEl.textContent=chk.checked?'Enviado em '+(SENT[id]||''):'';
  updateStats(filteredData());
  // Re-render table row without closing modal
  render();
}

function closeM(e){
  if(e&&e.target!==document.getElementById('ov'))return;
  document.getElementById('ov').classList.remove('open');
  document.body.style.overflow='';
  curModal=-1;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});

document.getElementById('search').addEventListener('input',function(){
  curS=this.value;document.getElementById('cx').style.display=this.value?'block':'none';render();
});
document.getElementById('cx').addEventListener('click',function(){
  document.getElementById('search').value='';curS='';this.style.display='none';render();
});
document.querySelectorAll('.fb').forEach(b=>{
  b.addEventListener('click',function(){
    document.querySelectorAll('.fb').forEach(x=>x.classList.remove('on'));
    this.classList.add('on');curF=this.dataset.f;render();
  });
});
window.addEventListener('scroll',()=>{
  document.getElementById('stb').classList.toggle('vis',window.scrollY>300);
});

render();
</script>
</body>
</html>
