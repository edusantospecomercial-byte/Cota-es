<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Lead Tracker — Eduardo & Mardila</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0A0A0F;--bg2:#111118;--bg3:#18181F;--bg4:#1E1E28;
  --border:#2A2A38;--border2:#36364A;
  --text:#F0F0F8;--text2:#9090A8;--text3:#5A5A72;
  --blue:#4F8EF7;--blue-d:#1A3A8A;--blue-bg:#0D1A3A;
  --green:#3DD68C;--green-d:#0B5C35;--green-bg:#071F12;
  --amber:#F5A623;--amber-d:#7A4A00;--amber-bg:#2A1800;
  --red:#F75F5F;--red-d:#7A1515;--red-bg:#2A0808;
  --purple:#A78BFA;--purple-bg:#1A1030;
  --teal:#2DD4BF;--teal-bg:#091E1B;
  --pink:#F472B6;--pink-bg:#2A0E1E;
  --r:12px;--rm:8px;--rs:6px;
  --font:'DM Sans',sans-serif;
  --mono:'DM Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}

/* LAYOUT */
.app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border)}
.header{padding:16px 18px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue)}
.logo-text{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.02em}
.header-badge{font-size:11px;color:var(--text2);background:var(--bg3);border:1px solid var(--border);padding:3px 10px;border-radius:20px;font-family:var(--mono)}

/* TABS */
.tabs{display:flex;background:var(--bg3);border-radius:var(--rm);padding:3px;gap:2px}
.tab{flex:1;font-size:12px;font-weight:500;color:var(--text2);padding:7px 4px;border-radius:var(--rs);cursor:pointer;border:none;background:none;font-family:var(--font);transition:all .15s;text-align:center}
.tab.on{background:var(--bg4);color:var(--text);border:1px solid var(--border)}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:14px 16px 80px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.content::-webkit-scrollbar{width:3px}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.sec{display:none}.sec.vis{display:block}

/* ALERT */
.alert{display:flex;gap:10px;background:var(--amber-bg);border:1px solid var(--amber-d);border-radius:var(--rm);padding:11px 13px;margin-bottom:12px}
.alert i{color:var(--amber);font-size:15px;flex-shrink:0;margin-top:1px}
.alert p{font-size:12px;color:#D4954A;line-height:1.45}
.alert strong{color:var(--amber);font-weight:600}

/* STATS ROW */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rm);padding:12px 14px}
.stat-n{font-size:24px;font-weight:600;color:var(--text);line-height:1;font-family:var(--mono)}
.stat-l{font-size:11px;color:var(--text2);margin-top:3px}
.stat-s{font-size:10px;margin-top:2px;color:var(--text3)}

/* TOOLBAR */
.toolbar{display:flex;gap:6px;margin-bottom:10px}
.srch{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rm);padding:8px 11px;font-size:13px;color:var(--text);font-family:var(--font);outline:none;transition:border .15s}
.srch:focus{border-color:var(--border2)}
.srch::placeholder{color:var(--text3)}
.fsel{appearance:none;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rm);padding:8px 9px;font-size:12px;color:var(--text2);font-family:var(--font);cursor:pointer;outline:none}
.fsel:focus{border-color:var(--border2)}

/* LEAD COUNT */
.lcount{font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:7px;letter-spacing:.03em}

/* LEAD CARD */
.lc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rm);padding:12px 14px;margin-bottom:6px;cursor:pointer;transition:border-color .15s,background .15s}
.lc:hover{border-color:var(--border2);background:var(--bg3)}
.lt{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;letter-spacing:.02em;font-family:var(--mono)}
.ln{font-size:13px;font-weight:500;color:var(--text);flex:1;line-height:1.25}
.sp{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;letter-spacing:.02em;font-family:var(--mono)}
.lm{display:flex;gap:8px;font-size:11px;color:var(--text3);flex-wrap:wrap;align-items:center}
.lm span{display:flex;align-items:center;gap:3px}
.src-tag{font-size:10px;background:var(--bg4);border:1px solid var(--border);color:var(--text3);padding:1px 6px;border-radius:4px;font-family:var(--mono)}
.lobs{font-size:11px;color:var(--text2);margin-top:5px;font-style:italic;line-height:1.35;border-left:2px solid var(--border2);padding-left:7px}

/* STATUS COLORS */
.s-novo{background:var(--blue-bg);color:var(--blue)}
.s-contato{background:var(--purple-bg);color:var(--purple)}
.s-cotacao{background:var(--amber-bg);color:var(--amber)}
.s-agendado{background:var(--green-bg);color:var(--green)}
.s-venda{background:var(--teal-bg);color:var(--teal)}
.s-followup{background:var(--pink-bg);color:var(--pink)}
.s-nao_atendeu{background:var(--red-bg);color:var(--red)}

/* AVATAR COLORS */
.va{background:#0D1A3A;color:#4F8EF7}
.vb{background:#071F12;color:#3DD68C}
.vc{background:#2A1800;color:#F5A623}
.vd{background:#2A0808;color:#F75F5F}
.ve{background:#1A1030;color:#A78BFA}
.vf{background:#2A0E1E;color:#F472B6}
.vg{background:#091E1B;color:#2DD4BF}

/* PAGINATION */
.pg{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.pg-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rm);padding:6px 14px;font-size:12px;color:var(--text2);cursor:pointer;font-family:var(--font);transition:all .15s}
.pg-btn:hover:not(:disabled){border-color:var(--border2);color:var(--text)}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-info{font-size:11px;color:var(--text3);font-family:var(--mono)}

/* DETAIL */
.back-btn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);background:none;border:none;cursor:pointer;padding:0;margin-bottom:14px;font-family:var(--font);transition:color .15s}
.back-btn:hover{color:var(--text)}
.dcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rm);overflow:hidden;margin-bottom:8px}
.dh{padding:14px 15px;border-bottom:1px solid var(--border)}
.dht{display:flex;align-items:flex-start;gap:10px}
.db{padding:14px 15px}
.dr{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.dr:last-child{border-bottom:none}
.dlb{font-size:11px;color:var(--text3);min-width:68px;padding-top:1px;flex-shrink:0;font-family:var(--mono)}
.dv{font-size:12px;color:var(--text);flex:1;line-height:1.45;word-break:break-all}

/* STATUS SELECTOR */
.ssel{display:flex;flex-wrap:wrap;gap:5px;padding:6px 0}
.ssopt{font-size:10px;padding:3px 9px;border-radius:20px;cursor:pointer;border:1px solid transparent;opacity:0.45;transition:opacity .15s;font-weight:600;font-family:var(--mono)}
.ssopt:hover,.ssopt.sel{opacity:1;border-color:currentColor}

/* NOTE */
.nta{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rm);padding:9px 11px;font-size:12px;color:var(--text);resize:none;height:64px;font-family:var(--font);margin-top:7px;outline:none;transition:border .15s}
.nta:focus{border-color:var(--border2)}
.nta::placeholder{color:var(--text3)}
.svbtn{margin-top:6px;width:100%;padding:9px;border-radius:var(--rm);background:var(--green-bg);color:var(--green);border:1px solid var(--green-d);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:background .15s}
.svbtn:hover{background:#0e2e1a}

/* ACTION BUTTONS */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.abtn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rm);padding:10px 10px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--text2);font-family:var(--font);transition:all .15s;font-weight:500}
.abtn:hover{border-color:var(--border2);color:var(--text)}
.abtn.p{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-d)}
.abtn.w{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-d)}
.abtn.s{background:var(--green-bg);color:var(--green);border-color:var(--green-d)}
.abtn.d{background:var(--red-bg);color:var(--red);border-color:var(--red-d)}

/* STATS PAGE */
.stat-bar-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.stat-bar-row:last-child{border-bottom:none}
.stat-bar{flex:1;background:var(--bg4);border-radius:3px;height:4px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:3px;transition:width .5s}
.stat-cnt{font-size:12px;color:var(--text2);min-width:24px;text-align:right;font-family:var(--mono)}

/* ADD LEAD */
.addcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rm);overflow:hidden}
.addh{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.addb{padding:13px 15px}
.fl{margin-bottom:12px}
.flab{font-size:11px;color:var(--text3);margin-bottom:4px;display:block;font-family:var(--mono)}
.finp{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rm);padding:9px 11px;font-size:13px;color:var(--text);font-family:var(--font);outline:none;transition:border .15s}
.finp:focus{border-color:var(--border2)}
.finp::placeholder{color:var(--text3)}
.fsel3{appearance:none;width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rm);padding:9px 11px;font-size:13px;color:var(--text2);font-family:var(--font);cursor:pointer;outline:none}
.subm{width:100%;padding:11px;border-radius:var(--rm);background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-d);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);margin-top:4px;transition:background .15s}
.subm:hover{background:#112050}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--border);display:flex;padding:8px 16px 20px;gap:4px;z-index:100}
.bnav{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:var(--rm);cursor:pointer;border:none;background:none;font-family:var(--font);transition:background .15s;color:var(--text3)}
.bnav.on{background:var(--bg4);color:var(--blue)}
.bnav i{font-size:20px}
.bnav span{font-size:10px;font-weight:500}

.empty-msg{text-align:center;padding:2rem;color:var(--text3);font-size:13px}
.section-title{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:9px;font-family:var(--mono)}
</style>
</head>

      </div>

    <div id="s-stats" class="sec">

            <div class="fl"><label class="flab">Responsável</label><select class="fsel3" id="now"><option>Eduardo</option><option>Mardila</option></select></div>
          </div>
          <div class="fl"><label class="flab">Status</label><select class="fsel3" id="nst"><option value="novo">Novo</option><option value="contato">Em contato</option><option value="agendado">Agendado</option><option value="cotacao">Cotação</option><option value="followup">Follow-up</option></select></div>
          <div class="fl"><label class="flab">Observação</label><textarea class="finp" id="no2" style="height:56px;resize:none" placeholder="Notas iniciais..."></textarea></div>
          <button class="subm" onclick="addLead()"><i class="ti ti-plus"></i> Adicionar lead</button>
        </div>
      </div>
    </div>

    <!-- DETAIL -->
    <div id="s-detail" class="sec">
      <button class="back-btn" onclick="goTab('pipeline')"><i class="ti ti-arrow-left"></i> Voltar</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="bnav on" id="nav-pipeline" onclick="goTab('pipeline')"><i class="ti ti-layout-kanban"></i><span>Pipeline</span></button>
    <button class="bnav" id="nav-stats" onclick="goTab('stats')"><i class="ti ti-chart-bar"></i><span>Resumo</span></button>
    <button class="bnav" id="nav-add" onclick="goTab('add')"><i class="ti ti-user-plus"></i><span>Novo Lead</span></button>
  </nav>
</div>

LEADS.forEach((l,i)=>{l.av=AVC[i%7];l.in=(l.n.split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase())||'?'});

const PER=20;
let filtered=[...LEADS],curPage=0,curTab='pipeline';

function goTab(tab){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('vis'));
  document.querySelectorAll('.bnav').forEach(b=>b.classList.remove('on'));
  document.getElementById('s-'+tab).classList.add('vis');
  const nav=document.getElementById('nav-'+tab);
  if(nav) nav.classList.add('on');
  curTab=tab;
  if(tab==='pipeline'){applyFilter();}
  if(tab==='stats'){renderStats();}
  window.scrollTo(0,0);
}

function applyFilter(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const st=document.getElementById('fst').value;
  const ow=document.getElementById('fow').value;
  filtered=LEADS.filter(l=>{
    if(st&&l.st!==st)return false;
    if(ow&&l.ow!==ow)return false;
    if(q&&!l.n.toLowerCase().includes(q)&&!l.ph.includes(q)&&!l.ob.toLowerCase().includes(q))return false;
    return true;
  });
  curPage=0;renderList();updateStats();
}

function renderList(){
  const start=curPage*PER,page=filtered.slice(start,start+PER);
  document.getElementById('lcount').textContent=`${filtered.length} resultado${filtered.length!==1?'s':''}`;
  document.getElementById('tot-badge').textContent=`${LEADS.length} leads`;
  document.getElementById('leads-list').innerHTML=!page.length?'<div class="empty-msg">Nenhum lead encontrado</div>':
    page.map(l=>`<div class="lc" onclick="openDetail(${l.id})">
      <div class="lt"><div class="av ${l.av}">${l.in}</div><div class="ln">${l.n}</div><div class="sp ${SP[l.st]}">${SL[l.st]}</div></div>
      <div class="lm">
        <span>${l.ow==='INDEFINIDO'?'—':l.ow}</span>
        <span>·</span><span>${l.d}</span>
        <span class="src-tag">${l.ft}</span>
      </div>
      ${l.ob?`<div class="lobs">${l.ob}</div>`:''}
    </div>`).join('');
  const tot=Math.ceil(filtered.length/PER)||1;
  document.getElementById('pg-info').textContent=`${curPage+1} / ${tot}`;
  document.getElementById('pg-prev').disabled=curPage===0;
  document.getElementById('pg-next').disabled=curPage>=tot-1;
}

function changePage(d){curPage+=d;document.querySelector('.content').scrollTo(0,0);renderList();}

function updateStats(){
  document.getElementById('st-total').textContent=LEADS.length;
  document.getElementById('st-venda').textContent=LEADS.filter(l=>l.st==='venda').length;
  document.getElementById('st-ag').textContent=LEADS.filter(l=>l.st==='agendado').length;
  document.getElementById('st-pend').textContent=LEADS.filter(l=>['cotacao','followup'].includes(l.st)).length;
  const ag=LEADS.filter(l=>l.st==='agendado').length,cot=LEADS.filter(l=>l.st==='cotacao').length,fu=LEADS.filter(l=>l.st==='followup').length;
  document.getElementById('alert-p').innerHTML=`<strong>${ag} agendados</strong> · <strong>${cot} cotações</strong> pendentes · <strong>${fu} follow-ups</strong>`;
}

function openDetail(id){
  const l=LEADS.find(x=>x.id===id);if(!l)return;
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('vis'));
  document.querySelectorAll('.bnav').forEach(b=>b.classList.remove('on'));
  document.getElementById('s-detail').classList.add('vis');
  document.getElementById('detail-content').innerHTML=`
    <div class="dcard">
      <div class="dh"><div class="dht">
        <div class="av ${l.av}" style="width:42px;height:42px;font-size:13px">${l.in}</div>
        <div style="flex:1"><div style="font-size:14px;font-weight:600;color:var(--text)">${l.n}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px">${l.ow==='INDEFINIDO'?'Sem responsável':l.ow} · ${l.ft} · ${l.d}</div></div>
        <div class="sp ${SP[l.st]}">${SL[l.st]}</div>
      </div></div>
      <div class="db">
        <div class="dr"><div class="dlb">Telefone</div><div class="dv" style="color:var(--blue)">${l.ph}</div></div>
        <div class="dr"><div class="dlb">Email</div><div class="dv" style="font-size:11px">${l.em}</div></div>
        <div class="dr"><div class="dlb">Observação</div><div class="dv">${l.ob||'—'}</div></div>
        <div class="dr"><div class="dlb">Status</div><div class="dv">
          <div class="ssel">${Object.entries(SL).map(([k,v])=>`<div class="ssopt sp ${SP[k]} ${l.st===k?'sel':''}" onclick="chgSt(${l.id},'${k}',this)">${v}</div>`).join('')}</div>
        </div></div>
        <div class="dr" style="flex-direction:column;align-items:stretch"><div class="dlb">Nota</div>
          <textarea class="nta" id="note-${l.id}" placeholder="Resultado, próximo passo..."></textarea>
          <button class="svbtn" onclick="saveNote(${l.id})">✓ Salvar nota</button>
        </div>
      </div>
    </div>
    <div class="agrid">
      <button class="abtn p" onclick="window.open('https://wa.me/${l.ph.replace(/[^\d]/g,'')}?text=Olá ${encodeURIComponent(l.n)}, tudo bem?')">📞 WhatsApp</button>
      <button class="abtn w" onclick="window.open('mailto:${l.em}')">✉️ Email</button>
      <button class="abtn s" onclick="copyPhone('${l.ph}')">📋 Copiar Tel.</button>
      <button class="abtn d" onclick="chgSt(${l.id},'venda',null);alert('Lead marcado como VENDA!')">🏆 Marcar Venda</button>
    </div>`;
}

function copyPhone(ph){navigator.clipboard.writeText(ph).then(()=>alert('Telefone copiado: '+ph));}

function chgSt(id,ns,el){
  const l=LEADS.find(x=>x.id===id);if(!l)return;
  l.st=ns;
  if(el){el.closest('.ssel').querySelectorAll('.ssopt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');}
  const badge=document.querySelector('.dht .sp');
  if(badge){badge.className=`sp ${SP[ns]}`;badge.textContent=SL[ns];}
}

function saveNote(id){
  const ta=document.getElementById('note-'+id);
  const l=LEADS.find(x=>x.id===id);
  if(!l||!ta||!ta.value.trim())return;
  l.ob=ta.value.trim();ta.value='';ta.placeholder='✓ Nota salva';
}

function renderStats(){
  const edu=LEADS.filter(l=>l.ow==='Eduardo').length;
  const mar=LEADS.filter(l=>l.ow==='Mardila').length;
  const ind=LEADS.filter(l=>l.ow==='INDEFINIDO').length;
  const rows=Object.entries(SL).map(([k,v])=>{
    const cnt=LEADS.filter(l=>l.st===k).length;
    const pct=Math.round(cnt/LEADS.length*100);
    return `<div class="stat-bar-row">
      <div class="sp ${SP[k]}" style="min-width:88px;text-align:center;font-size:10px">${v}</div>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:${pct}%;background:${SBAR_COLORS[k]}"></div></div>
      <div class="stat-cnt">${cnt}</div>
    </div>`;
  }).join('');
  document.getElementById('stats-content').innerHTML=`
    <div class="dcard" style="margin-bottom:8px"><div class="db">
      <div class="section-title" style="margin-bottom:6px">Por status</div>${rows}
    </div></div>
    <div class="dcard"><div class="db">
      <div class="section-title" style="margin-bottom:10px">Por responsável</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">
        <div style="background:var(--bg3);border-radius:var(--rm);padding:12px 8px"><div style="font-size:22px;font-weight:600;color:var(--blue);font-family:var(--mono)">${edu}</div><div style="font-size:11px;color:var(--text3);margin-top:3px">Eduardo</div></div>
        <div style="background:var(--bg3);border-radius:var(--rm);padding:12px 8px"><div style="font-size:22px;font-weight:600;color:var(--green);font-family:var(--mono)">${mar}</div><div style="font-size:11px;color:var(--text3);margin-top:3px">Mardila</div></div>
        <div style="background:var(--bg3);border-radius:var(--rm);padding:12px 8px"><div style="font-size:22px;font-weight:600;color:var(--text3);font-family:var(--mono)">${ind}</div><div style="font-size:11px;color:var(--text3);margin-top:3px">Sem dono</div></div>
      </div>
    </div></div>`;
}

function addLead(){
  const name=document.getElementById('nn').value.trim();if(!name)return;
  const init=name.split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
  LEADS.push({id:Date.now(),n:name,in:init,av:AVC[LEADS.length%7],
    ph:document.getElementById('np').value||'—',em:document.getElementById('nem').value||'—',
    ft:document.getElementById('nft').value,ow:document.getElementById('now').value,
    st:document.getElementById('nst').value,d:new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),
    ob:document.getElementById('no2').value||''});
  ['nn','np','nem','no2'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  goTab('pipeline');
}

updateStats();applyFilter();
</script>
