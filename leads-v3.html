  if(flt==='venda')d=d.filter(c=>c.status==='VENDA');
  else if(flt==='cotacao')d=d.filter(c=>c.status==='COTAÇÃO');
  else if(flt==='agendado')d=d.filter(c=>c.status==='AGENDADO');
  else if(flt==='ig')d=d.filter(c=>c.fonte==='ig');
  else if(flt==='fb')d=d.filter(c=>c.fonte==='fb');
  else if(flt==='wa')d=d.filter(c=>c.tel_wa&&c.tel_wa.length>7);
  else if(flt==='edu')d=d.filter(c=>c.vendedor==='Eduardo');
  else if(flt==='mar')d=d.filter(c=>c.vendedor==='Mardila');
  else if(flt==='jaq')d=d.filter(c=>c.vendedor==='Jaqueline');
  else if(flt==='env')d=d.filter(c=>c.sent);
  return d;
};

const upSt=d=>{
  document.getElementById('s-total').textContent=d.length;
  document.getElementById('s-v').textContent=d.filter(c=>c.status==='VENDA').length;
  document.getElementById('s-c').textContent=d.filter(c=>c.status==='COTAÇÃO').length;
  document.getElementById('s-w').textContent=d.filter(c=>c.tel_wa&&c.tel_wa.length>7).length;
  document.getElementById('s-e').textContent=DATA.filter(c=>c.sent).length;
  document.getElementById('tb').textContent=DATA.length;
};

const togE=(id,el)=>{
  const i=DATA.findIndex(c=>c.id===id);if(i<0)return;
  DATA[i].sent=!DATA[i].sent;
  ST[id]=DATA[i].sent?new Date().toLocaleDateString('pt-BR'):undefined;
  if(!ST[id])delete ST[id];sS(ST);
  el.className='env-btn'+(DATA[i].sent?' sent':'');
  el.innerHTML=`<span class="dot"></span>${DATA[i].sent?'✅ Enviado':'Marcar Enviado'}`;
  upSt(getD());
};

const togEM=(id,chk)=>{
  const i=DATA.findIndex(c=>c.id===id);if(i<0)return;
  DATA[i].sent=chk.checked;
  ST[id]=chk.checked?new Date().toLocaleDateString('pt-BR'):undefined;
  if(!ST[id])delete ST[id];sS(ST);
  const de=document.getElementById('md-date');if(de)de.textContent=chk.checked?'Enviado em '+(ST[id]||''):'';
  upSt(getD());render();
};

function render(){
  const d=getD();
  upSt(d);
  document.getElementById('ri').textContent=(srch||flt!=='all')?`${d.length} resultado${d.length!==1?'s':''}`:'';
  const tbody=document.getElementById('tbody');
  const nr=document.getElementById('nr');
  if(!d.length){tbody.innerHTML='';nr.style.display='block';return;}
  nr.style.display='none';
  tbody.innerHTML=d.map((c,i)=>{
    const wa=waU(c);
    const av=c.fonte==='fb'?'fb':'ig';
    const em=(c.email||'').length>22?(c.email||'').substring(0,20)+'…':(c.email||'—');
    const ed=ST[c.id]||'';
    const di=DATA.indexOf(c);
    return`<tr onclick="oM(${di})">
<td class="seq">${i+1}</td>
<td><div class="row-name"><div class="avatar ${av}">${ini(c.nome)}</div><div><div class="name-main">${c.nome}</div><div class="name-sub">${em}</div></div></div></td>
<td><span class="mono">${c.data||'—'}</span></td>
<td>${srcB(c.fonte)}</td>
<td onclick="event.stopPropagation()">${wa?`<a class="wa-link" href="${wa}" target="_blank"><span class="wa-ico"></span>${c.tel||'WA'}</a>`:`<span class="no-tel">${c.tel||'—'}</span>`}</td>
<td><span class="email-cell" title="${c.email||''}">${em}</span></td>
<td>${vdB(c.vendedor)}</td>
<td>${stg(c.status)}</td>
<td onclick="event.stopPropagation()"><span class="obs-cell" title="${c.obs||''}">${c.obs||'—'}</span></td>
<td onclick="event.stopPropagation()"><button class="env-btn${c.sent?' sent':''}" onclick="togE(${c.id},this)"><span class="dot"></span>${c.sent?'✅ Enviado':'Marcar Enviado'}</button>${ed?`<div class="env-date-small">${ed}</div>`:''}</td>
</tr>`;
  }).join('');
}

function oM(idx){
  const c=DATA[idx];if(!c)return;
  const wa=waU(c);const av=c.fonte==='fb'?'fb':'ig';
  document.getElementById('mAv').textContent=ini(c.nome);
  document.getElementById('mAv').className='modal-av '+av;
  document.getElementById('mNm').textContent=c.nome;
  document.getElementById('mSb').textContent=`${c.fonte==='ig'?'📸 Instagram':'📘 Facebook'} · ${c.data||'—'} · ${c.vendedor||'—'}`;
  const msg=MSG.replace('{N}',(c.nome||'').split(' ')[0]);
  const ed=ST[c.id]||'';
  document.getElementById('mBd').innerHTML=`
<div class="action-row">
  <a class="action-btn wa-action${wa?'':' disabled'}" href="${wa||'#'}" target="_blank">
    <span style="display:inline-block;width:15px;height:15px;background-image:url(&quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2325D366' d='M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z'/%3E%3C/svg%3E&quot;);background-size:contain;background-repeat:no-repeat;flex-shrink:0;"></span>
    Abrir WhatsApp
  </a>
  <a class="action-btn email-action${c.email?'':' disabled'}" href="mailto:${c.email||''}">✉️ Email</a>
</div>
<div class="section-lbl">Status de Contato</div>
<div class="sent-row">
  <span class="slabel">Mensagem enviada?</span>
  <span class="sent-date" id="md-date">${ed?'Enviado em '+ed:''}</span>
  <label class="toggle-wrap"><input type="checkbox" ${c.sent?'checked':''} onchange="togEM(${c.id},this)"><span class="toggle-track"></span></label>
</div>
<div class="section-lbl">Dados do Lead</div>
<div class="field-grid">
  <div class="field-item"><div class="field-label">Data Captação</div><div class="field-val blue">${c.data||'—'}</div></div>
  <div class="field-item"><div class="field-label">Fonte</div><div class="field-val">${c.fonte==='ig'?'📸 Instagram':'📘 Facebook'}</div></div>
  <div class="field-item"><div class="field-label">Telefone</div><div class="field-val">${c.tel||'—'}</div></div>
  <div class="field-item"><div class="field-label">Vendedor</div><div class="field-val">${c.vendedor||'—'}</div></div>
  <div class="field-item full"><div class="field-label">Email</div><div class="field-val">${c.email||'—'}</div></div>
  <div class="field-item"><div class="field-label">Status</div><div class="field-val green">${c.status}</div></div>
  <div class="field-item"><div class="field-label">Observação</div><div class="field-val amber">${c.obs||'—'}</div></div>
</div>
<div class="section-lbl">Mensagem WhatsApp</div>
<div class="msg-preview">${msg}</div>`;
  document.getElementById('ov').classList.add('open');
  document.body.style.overflow='hidden';
}

function cM(e){if(e&&e.target!==document.getElementById('ov'))return;document.getElementById('ov').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cM();});
document.getElementById('search').addEventListener('input',function(){srch=this.value;document.getElementById('cx').style.display=this.value?'block':'none';render();});
document.getElementById('cx').addEventListener('click',function(){document.getElementById('search').value='';srch='';this.style.display='none';render();});
document.querySelectorAll('.btn').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('.btn').forEach(x=>x.classList.remove('on'));this.classList.add('on');flt=this.dataset.f;render();});});
window.addEventListener('scroll',()=>{document.getElementById('su').classList.toggle('show',window.scrollY>300);});
render();
</script>
</body>
</html>
